name: 功能建议
description: 希望增加或改进什么功能，以及它能解决什么需求。
title: "[功能建议] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 简单说明使用场景和期待的效果即可，不需要提供技术实现方案。
  - type: textarea
    id: need
    attributes:
      label: 你遇到了什么不方便
      description: 描述实际使用场景，让我们理解这个需求。
      placeholder: "例如：用电视看长篇短剧时，快看完一集却不知道整部剧还剩多少集。"
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 希望怎样改进
      description: 描述你期待看到或做到的效果。
      placeholder: "例如：每集接近结束时，短暂显示“第 80 / 100 集”和整剧进度。"
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: 希望支持的平台（选填，可多选）
      multiple: true
      options:
        - 所有平台
        - Android 标准版
        - Android MPV 版
        - LG webOS 版
        - macOS 桌面版
        - Windows 桌面版
        - Linux AppImage 版
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: 参考截图或补充说明（选填）
      description: 可添加截图、链接或其他应用的参考效果。
    validations:
      required: false
